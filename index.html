<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背景透過</title>
<style>
:root{
  --bg:#f3f5f4;--fg:#16211d;--sub:#5d6b66;--line:#cdd6d2;--accent:#0f7a5c;--accent-fg:#fff;--card:#fff;
  --c1:#e4e8e6;--c2:#fff;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1513;--fg:#e8efec;--sub:#8d9c96;--line:#2a3733;--accent:#3ecf9f;--accent-fg:#06231a;--card:#171f1c;--c1:#1f2926;--c2:#26322e}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  line-height:1.7;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
}
main{max-width:880px;margin:0 auto}
h1{font-size:clamp(28px,6vw,44px);margin:24px 0 4px;letter-spacing:.02em}
p.lead{margin:0 0 28px;color:var(--sub)}
#drop{
  display:block;border:2px dashed var(--line);border-radius:14px;background:var(--card);
  padding:48px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
}
#drop.over,#drop:focus-within{border-color:var(--accent)}
#drop strong{display:block;font-size:18px;margin-bottom:4px}
#drop span{color:var(--sub);font-size:14px}
#file{position:absolute;opacity:0;width:1px;height:1px}
#status{min-height:28px;margin:16px 0;color:var(--sub);font-size:14px}
#status.err{color:#c0392b}
#result{display:none;grid-template-columns:1fr 1fr;gap:16px}
#result.show{display:grid}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
figcaption{font-size:13px;color:var(--sub);margin-bottom:8px}
.box{
  border-radius:6px;overflow:hidden;line-height:0;
  background-color:var(--c1);
  background-image:linear-gradient(45deg,var(--c2) 25%,transparent 25%,transparent 75%,var(--c2) 75%),linear-gradient(45deg,var(--c2) 25%,transparent 25%,transparent 75%,var(--c2) 75%);
  background-size:20px 20px;background-position:0 0,10px 10px;
}
.box img{width:100%;height:auto;display:block}
.actions{display:none;margin-top:20px;gap:12px;flex-wrap:wrap}
.actions.show{display:flex}
button,a.btn{
  font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 22px;cursor:pointer;
  background:var(--accent);color:var(--accent-fg);text-decoration:none;display:inline-block;
}
button.sub{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible,a.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
@media (max-width:600px){#result{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>背景透過</h1>
  <p class="lead">画像を選ぶと、背景を切り抜いた透過PNGを作ります。処理はお使いの端末内で行われ、画像は送信されません。</p>
  <label id="drop" for="file">
    <strong>画像を選択またはドロップ</strong>
    <span>JPG / PNG / WebP</span>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
  </label>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="result">
    <figure><figcaption>元画像</figcaption><div class="box"><img id="before" alt="元画像"></div></figure>
    <figure><figcaption>透過結果</figcaption><div class="box"><img id="after" alt="透過結果"></div></figure>
  </div>
  <div id="actions" class="actions">
    <a id="dl" class="btn" download="transparent.png">PNGを保存</a>
    <button id="reset" class="sub" type="button">別の画像を選ぶ</button>
  </div>
</main>
<script type="module">
import { removeBackground } from "https://esm.sh/@imgly/background-removal@1.5.5";

const MAX_SIDE = 1600;

const $ = id => document.getElementById(id);
const drop = $("drop"), file = $("file"), statusEl = $("status");
const result = $("result"), actions = $("actions");
let urls = [];
let busy = false;

function setStatus(msg, err) {
  statusEl.textContent = msg;
  statusEl.className = err ? "err" : "";
}

function clearUrls() {
  urls.forEach(u => URL.revokeObjectURL(u));
  urls = [];
}

function loadImage(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

function toBlob(canvas, type, q) {
  return new Promise(r => canvas.toBlob(r, type, q));
}

async function shrink(f) {
  const img = await loadImage(f);
  const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  if (scale === 1) return f;
  const w = Math.round(img.naturalWidth * scale);
  const h = Math.round(img.naturalHeight * scale);
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return await toBlob(c, "image/jpeg", 0.92);
}

async function handle(f) {
  if (busy) return;
  if (!f || !/^image\/(jpeg|png|webp)$/.test(f.type)) {
    setStatus("JPG・PNG・WebPの画像を選んでください", true);
    return;
  }
  busy = true;
  clearUrls();
  result.classList.remove("show");
  actions.classList.remove("show");
  try {
    setStatus("画像を最適化しています…");
    const small = await shrink(f);
    const beforeUrl = URL.createObjectURL(small);
    urls.push(beforeUrl);
    $("before").src = beforeUrl;

    setStatus("背景を除去しています…（初回はモデルの読み込みに時間がかかります）");
    const out = await removeBackground(small, {
      output: { format: "image/png" },
      progress: (key, current, total) => {
        if (key.startsWith("fetch") && total) {
          setStatus("モデルを読み込み中… " + Math.round(current / total * 100) + "%");
        } else if (key.startsWith("compute")) {
          setStatus("背景を除去しています…");
        }
      }
    });
    const afterUrl = URL.createObjectURL(out);
    urls.push(afterUrl);
    $("after").src = afterUrl;
    $("dl").href = afterUrl;
    const base = f.name.replace(/\.[^.]+$/, "") || "image";
    $("dl").download = base + "-transparent.png";

    result.classList.add("show");
    actions.classList.add("show");
    setStatus("完了しました");
  } catch (e) {
    setStatus(e.message || "エラーが発生しました", true);
  } finally {
    busy = false;
  }
}

file.addEventListener("change", () => handle(file.files[0]));
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handle(e.dataTransfer.files[0]));
$("reset").addEventListener("click", () => {
  clearUrls();
  file.value = "";
  result.classList.remove("show");
  actions.classList.remove("show");
  setStatus("");
});
</script>
</body>
</html>
