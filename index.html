<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>モデル比較</title>
<style>
:root{
  --bg:#eef1ef;--fg:#14201b;--sub:#58675f;--line:#c9d3ce;--accent:#0f7a5c;--accent2:#14a37a;--accent-fg:#fff;
  --card:rgba(255,255,255,.8);--track:#dde4e0;--c1:#e4e8e6;--c2:#fff;--shadow:0 1px 2px rgba(20,32,27,.06),0 12px 32px -12px rgba(20,32,27,.18);--err:#b83a2c;--warn:#8a5a00;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1311;--fg:#e8efec;--sub:#8d9c96;--line:#27342f;--accent:#3ecf9f;--accent2:#7be3c0;--accent-fg:#05211a;
  --card:rgba(23,31,28,.85);--track:#25302c;--c1:#1f2926;--c2:#2a3632;--shadow:0 1px 2px rgba(0,0,0,.4),0 16px 36px -14px rgba(0,0,0,.6);--err:#ff7b6b;--warn:#e8b64a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--fg);
  background:radial-gradient(900px 480px at 85% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),linear-gradient(180deg,var(--bg),var(--track));
  background-attachment:fixed;
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  line-height:1.7;padding:max(28px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom));
}
main{max-width:960px;margin:0 auto}
h1{font-size:clamp(26px,5.5vw,38px);margin:20px 0 6px;letter-spacing:.04em;line-height:1.25}
p.lead{margin:0 0 24px;color:var(--sub);max-width:64ch}
.panel{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
#drop{display:block;border:1.5px dashed var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:44px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
#drop:hover,#drop.over,#drop:focus-within{border-color:var(--accent)}
#drop strong{display:block;font-size:18px}
#drop span{color:var(--sub);font-size:14px}
#file{position:absolute;opacity:0;width:1px;height:1px}
#status{min-height:24px;margin:16px 2px 0;color:var(--sub);font-size:14px}
#status.err{color:var(--err);font-weight:700}
.bar{display:none;height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:10px}
.bar.show{display:block}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
#results{display:none;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
#results.show{display:grid}
.card{padding:14px}
.card h2{font-size:17px;margin:0 0 2px}
.card h2 small{color:var(--sub);font-weight:400;font-size:13px;margin-left:6px}
.box{margin:10px 0 12px;border-radius:10px;overflow:hidden;line-height:0;border:1px solid var(--line);
  background-color:var(--c1);
  background-image:linear-gradient(45deg,var(--c2) 25%,transparent 25%,transparent 75%,var(--c2) 75%),linear-gradient(45deg,var(--c2) 25%,transparent 25%,transparent 75%,var(--c2) 75%);
  background-size:20px 20px;background-position:0 0,10px 10px}
.box img{width:100%;height:auto;display:block}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
dt{color:var(--sub)}
dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
dd.best{color:var(--accent)}
dd.best::after{content:" ◎";font-weight:400}
.note{margin:18px 2px 0;color:var(--sub);font-size:13px}
button{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:10px 20px;cursor:pointer;background:transparent;color:var(--fg);margin-top:18px;display:none}
button.show{display:inline-block}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
@media (max-width:600px){#results{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>モデル比較</h1>
  <p class="lead">同じ画像を medium（従来）と small（現在）で処理し、ダウンロード量・読み込み時間・処理時間・見た目を並べて比べます。処理はすべて端末内で行われます。</p>
  <label id="drop" for="file">
    <strong>画像を選択またはドロップ</strong>
    <span>JPG / PNG / WebP</span>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
  </label>
  <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="results">
    <section class="card panel" id="card-medium"></section>
    <section class="card panel" id="card-small"></section>
  </div>
  <p class="note" id="note" hidden>◎ は良い方の値です。先に計測したモデルは、実行環境（WASM）の取得時間が読み込み時間に含まれるため、読み込み時間は不利になります。処理時間は「2回目」の値が、読み込みを除いた実力に近くなります。</p>
  <button id="again" type="button">別の画像で試す</button>
</main>
<script type="module">
const BG_URL = "https://esm.sh/@imgly/background-removal@1.7.0";
const MAX_SIDE = 1600;
const MODELS = [
  { id: "medium", label: "medium", sub: "従来" },
  { id: "small", label: "small", sub: "現在" }
];
const WORKER_SRC = `
import { removeBackground } from "${BG_URL}";
self.onmessage = async e => {
  try {
    const out = await removeBackground(e.data.blob, {
      model: e.data.model,
      output: { format: "image/png" },
      progress: (key, current, total) => self.postMessage({ type: "progress", key, current, total })
    });
    self.postMessage({ type: "done", blob: out });
  } catch (err) {
    self.postMessage({ type: "error", message: String((err && err.message) || err) });
  }
};
`;

const $ = id => document.getElementById(id);
const drop = $("drop"), file = $("file"), statusEl = $("status"), bar = $("bar");
const results = $("results"), again = $("again"), note = $("note");
let urls = [];
let busy = false;
let worker = null;

function setStatus(msg, err) {
  statusEl.textContent = msg;
  statusEl.className = err ? "err" : "";
}

function setBar(p) {
  bar.classList.add("show");
  bar.firstElementChild.style.width = p + "%";
  bar.setAttribute("aria-valuenow", Math.round(p));
}

function clearUrls() {
  urls.forEach(u => URL.revokeObjectURL(u));
  urls = [];
}

function loadImage(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

function toBlob(canvas, type, q) {
  return new Promise(r => canvas.toBlob(r, type, q));
}

async function shrink(f) {
  const img = await loadImage(f);
  const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  if (scale === 1) return f;
  const w = Math.round(img.naturalWidth * scale);
  const h = Math.round(img.naturalHeight * scale);
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return await toBlob(c, "image/jpeg", 0.92);
}

function getWorker() {
  if (!worker) {
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
    worker = new Worker(url, { type: "module" });
  }
  return worker;
}

function run(model, blob) {
  return new Promise((resolve, reject) => {
    const w = getWorker();
    const t0 = performance.now();
    let tDecode = null;
    const totals = {};
    const cleanup = () => {
      w.removeEventListener("message", onMsg);
      w.removeEventListener("error", onErr);
    };
    const onMsg = e => {
      const d = e.data;
      if (d.type === "progress") {
        if (d.key.startsWith("fetch")) totals[d.key] = d.total;
        if (d.key === "compute:decode" && tDecode === null) tDecode = performance.now();
      } else if (d.type === "done") {
        const tEnd = performance.now();
        cleanup();
        const start = tDecode === null ? t0 : tDecode;
        resolve({
          out: d.blob,
          load: start - t0,
          proc: tEnd - start,
          bytes: Object.values(totals).reduce((a, b) => a + b, 0)
        });
      } else if (d.type === "error") {
        cleanup();
        reject(new Error(d.message));
      }
    };
    const onErr = () => {
      cleanup();
      worker = null;
      reject(new Error("処理を開始できませんでした。ブラウザを更新して再度お試しください"));
    };
    w.addEventListener("message", onMsg);
    w.addEventListener("error", onErr);
    w.postMessage({ blob, model });
  });
}

function fmtSec(ms) {
  return (ms / 1000).toFixed(2) + " 秒";
}

function fmtMB(n) {
  return n ? (n / 1048576).toFixed(1) + " MB" : "キャッシュ済み";
}

function fmtKB(n) {
  return n >= 1048576 ? (n / 1048576).toFixed(2) + " MB" : Math.round(n / 1024) + " KB";
}

function render(stats) {
  const keys = ["bytes", "load", "proc1", "proc2", "size"];
  const best = {};
  keys.forEach(k => {
    const vals = MODELS.map(m => stats[m.id][k]);
    if (k === "bytes" && vals.some(v => !v)) return;
    const min = Math.min(...vals);
    const max = Math.max(...vals);
    if (min !== max) best[k] = MODELS[vals.indexOf(min)].id;
  });
  MODELS.forEach(m => {
    const s = stats[m.id];
    const cls = k => (best[k] === m.id ? "best" : "");
    const url = URL.createObjectURL(s.out);
    urls.push(url);
    $("card-" + m.id).innerHTML =
      "<h2>" + m.label + "<small>" + m.sub + "</small></h2>" +
      '<div class="box"><img alt="' + m.label + 'の結果" src="' + url + '"></div>' +
      "<dl>" +
      "<dt>ダウンロード量</dt><dd class=\"" + cls("bytes") + "\">" + fmtMB(s.bytes) + "</dd>" +
      "<dt>読み込み時間</dt><dd class=\"" + cls("load") + "\">" + fmtSec(s.load) + "</dd>" +
      "<dt>処理時間（初回）</dt><dd class=\"" + cls("proc1") + "\">" + fmtSec(s.proc1) + "</dd>" +
      "<dt>処理時間（2回目）</dt><dd class=\"" + cls("proc2") + "\">" + fmtSec(s.proc2) + "</dd>" +
      "<dt>出力ファイル</dt><dd class=\"" + cls("size") + "\">" + fmtKB(s.out.size) + "</dd>" +
      "</dl>";
  });
}

async function handle(f) {
  if (busy) return;
  if (!f || !/^image\/(jpeg|png|webp)$/.test(f.type)) {
    setStatus("JPG・PNG・WebPの画像を選んでください", true);
    return;
  }
  busy = true;
  clearUrls();
  results.classList.remove("show");
  note.hidden = true;
  again.classList.remove("show");
  setBar(0);
  try {
    setStatus("画像を最適化しています…");
    const small = await shrink(f);
    const stats = {};
    const steps = MODELS.length * 2;
    let n = 0;
    for (const m of MODELS) {
      setStatus(m.label + " を計測しています（1回目）… 初回はモデルをダウンロードします");
      const r1 = await run(m.id, small);
      setBar(++n / steps * 100);
      setStatus(m.label + " を計測しています（2回目）…");
      const r2 = await run(m.id, small);
      setBar(++n / steps * 100);
      stats[m.id] = { out: r2.out, bytes: r1.bytes, load: r1.load, proc1: r1.proc, proc2: r2.proc, size: r2.out.size };
    }
    render(stats);
    results.classList.add("show");
    note.hidden = false;
    again.classList.add("show");
    setStatus("計測が完了しました（画像サイズ " + (f.size / 1024).toFixed(0) + " KB）");
  } catch (e) {
    setStatus(e.message || "エラーが発生しました", true);
    bar.classList.remove("show");
  } finally {
    busy = false;
  }
}

file.addEventListener("change", () => handle(file.files[0]));
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handle(e.dataTransfer.files[0]));
again.addEventListener("click", () => {
  clearUrls();
  file.value = "";
  results.classList.remove("show");
  note.hidden = true;
  again.classList.remove("show");
  bar.classList.remove("show");
  setStatus("");
});
</script>
</body>
</html>
